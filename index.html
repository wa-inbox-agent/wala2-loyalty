<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ولاء - برنامج ولاء لأي نشاط</title>
<style>
:root{--c:#0f766e;--bg:#f4f6f5;--ink:#14201e;--mut:#64748b;--card:#fff;--line:#e2e8e6}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:8px 0}h2{font-size:19px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:13px;border:1px solid #cbd5d1;border-radius:12px;font-size:17px;font-family:inherit;background:#fff}
input[type=color]{padding:2px;height:46px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:18px;font-weight:700;margin-top:14px;font-family:inherit;cursor:pointer}
.btn.alt{background:#fff;color:var(--c);border:2px solid var(--c)}
.btn:disabled{opacity:.5}
.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px;font-size:15px}
.ok{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;margin-top:10px;font-size:15px}
.hero{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:20px;padding:24px;margin:8px 0}
.hero p{margin:6px 0 0;opacity:.95;line-height:1.7}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:12px;border:2px solid #cbd5d1;background:#fff;font-size:16px;font-family:inherit}
.seg button.on{border-color:var(--c);background:#ecfdf5;font-weight:700}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex}
nav.tabs button{flex:1;padding:14px 4px;border:0;background:none;font-size:15px;font-family:inherit;color:var(--mut)}
nav.tabs button.on{color:var(--c);font-weight:700;border-top:3px solid var(--c);margin-top:-1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--c)}.stat span{font-size:13px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row small{color:var(--mut);display:block;margin-top:2px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.dot{width:42px;height:42px;border-radius:50%;border:2px dashed var(--c);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.dot.f{background:var(--c);border:2px solid var(--c)}
.bar{height:16px;background:#e2e8e6;border-radius:99px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--c)}
.big{font-size:44px;font-weight:800;color:var(--c);text-align:center}
.center{text-align:center}.mut{color:var(--mut);font-size:14px}
.link{direction:ltr;text-align:left;background:#f1f5f4;padding:10px;border-radius:10px;word-break:break-all;font-size:14px}
a{color:var(--c)}
.celebrate{background:#fef9c3;border:2px solid #facc15;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let token = localStorage.getItem('tok') || '';
let me = null, tab = 'staff';
const api = async (method, url, data) => {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: data ? JSON.stringify(data) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { if (r.status === 401 && token) { token = ''; localStorage.removeItem('tok'); } throw new Error(j.error || 'حصل خطأ'); }
  return j;
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const msg = (id, t, ok) => { const e = $(id); if (e) e.innerHTML = t ? `<div class="${ok ? 'ok' : 'err'}">${esc(t)}</div>` : ''; };
const fmtDate = t => t ? new Date(t).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }) : '-';
const unit = b => b.mode === 'points' ? 'نقطة' : 'ختم';

// ---------- routing ----------
async function route() {
  const p = location.pathname;
  const m = p.match(/^\/b\/([^/]+)/);
  if (m) return customerView(m[1]);
  if (token) { try { me = await api('GET', '/api/me'); document.documentElement.style.setProperty('--c', me.color); return dash(); } catch (e) {} }
  return landing();
}

// ---------- landing / signup / login ----------
function landing() {
  document.documentElement.style.setProperty('--c', '#0f766e');
  app.innerHTML = `
  <div class="hero"><h1>برنامج ولاء لأي نشاط</h1>
  <p>خلي عملاءك يرجعولك. كل زيارة أو فاتورة بتتسجل كختم أو نقاط، ولما العميل يكمل بياخد مكافأة. تفتح حسابك في دقيقة وتشتغل من الموبايل.</p></div>
  <div class="card"><h2>إزاي بيشتغل؟</h2>
  <p>١. تسجل نشاطك وتختار ختم أو نقاط وشكل المكافأة.<br>٢. العميل يقولك رقم جواله عند الدفع وإنت تضغط "سجل".<br>٣. العميل يفتح رابط نشاطك ويكتب رقمه يشوف كارته.<br>٤. لما يكمل، تدّيه المكافأة بضغطة.</p></div>
  <div class="card"><div class="seg"><button id="tSign" class="on">حساب جديد</button><button id="tLog">دخول</button></div><div id="form"></div></div>`;
  const show = mode => {
    $('#tSign').classList.toggle('on', mode === 's'); $('#tLog').classList.toggle('on', mode === 'l');
    $('#form').innerHTML = mode === 's' ? signupForm() : loginForm();
    if (mode === 's') wireSignup(); else wireLogin();
  };
  $('#tSign').onclick = () => show('s'); $('#tLog').onclick = () => show('l'); show('s');
}
function signupForm() {
  return `<label>اسم النشاط</label><input id="name" placeholder="مثال: صالون ورد" autocomplete="organization">
  <label>رابط النشاط بالإنجليزي (اختياري)</label><input id="slug" dir="ltr" placeholder="rose-salon" autocapitalize="none">
  <label>رقم جوالك (لتسجيل الدخول)</label><input id="phone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx">
  <label>كلمة السر</label><input id="pw" type="password" autocomplete="new-password">
  <label>نظام الولاء</label><div class="seg"><button type="button" data-m="stamps" class="on">أختام (زيارات)</button><button type="button" data-m="points">نقاط (حسب المبلغ)</button></div>
  <div id="stampsHelp" class="mut" style="margin-top:6px"></div>
  <label id="goalL">عدد الأختام لإكمال المكافأة</label><input id="goal" type="number" inputmode="numeric" value="10">
  <div id="rateBox" style="display:none"><label>كام نقطة عن كل 1 ريال/جنيه؟</label><input id="rate" type="number" step="0.1" value="1"></div>
  <label>المكافأة</label><input id="reward" placeholder="مثال: قص شعر مجاني" value="">
  <button class="btn" id="go">افتح حسابي</button><div id="m"></div>`;
}
let sMode = 'stamps';
function wireSignup() {
  sMode = 'stamps';
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    sMode = b.dataset.m; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b));
    $('#rateBox').style.display = sMode === 'points' ? 'block' : 'none';
    $('#goalL').textContent = sMode === 'points' ? 'عدد النقاط لإكمال المكافأة' : 'عدد الأختام لإكمال المكافأة';
    $('#goal').value = sMode === 'points' ? 100 : 10;
  });
  $('#go').onclick = async () => {
    $('#go').disabled = true;
    try {
      const r = await api('POST', '/api/signup', { name: $('#name').value, slug: $('#slug').value, phone: $('#phone').value, password: $('#pw').value, mode: sMode, goal: $('#goal').value, rate: $('#rate').value, reward: $('#reward').value });
      token = r.token; localStorage.setItem('tok', token); route();
    } catch (e) { msg('#m', e.message); $('#go').disabled = false; }
  };
}
function loginForm() {
  return `<label>رقم الجوال</label><input id="phone" type="tel" inputmode="numeric">
  <label>كلمة السر</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">دخول</button><div id="m"></div>`;
}
function wireLogin() {
  $('#go').onclick = async () => {
    try { const r = await api('POST', '/api/login', { phone: $('#phone').value, password: $('#pw').value }); token = r.token; localStorage.setItem('tok', token); route(); }
    catch (e) { msg('#m', e.message); }
  };
}

// ---------- dashboard ----------
function dash() {
  app.innerHTML = `<div class="center"><h1>${esc(me.name)}</h1></div><div id="view"></div>
  <nav class="tabs"><button data-t="staff">تسجيل</button><button data-t="cust">العملاء</button><button data-t="set">الإعدادات</button></nav>`;
  document.querySelectorAll('nav.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => { tab = b.dataset.t; dash(); }; });
  ({ staff: staffView, cust: custView, set: setView })[tab]();
}
function staffView() {
  const pts = me.mode === 'points';
  $('#view').innerHTML = `
  <div class="stats"><div class="stat"><b>${me.stats.customers}</b><span>عميل</span></div><div class="stat"><b>${me.stats.week}</b><span>عملية آخر 7 أيام</span></div></div>
  <div class="card"><h2>تسجيل ${pts ? 'فاتورة' : 'زيارة'}</h2>
  <label>رقم جوال العميل</label><input id="ph" type="tel" inputmode="numeric" placeholder="05xxxxxxxx">
  <label>اسم العميل (اختياري)</label><input id="cn">
  ${pts ? '<label>مبلغ الفاتورة</label><input id="sp" type="number" inputmode="decimal">' : ''}
  <button class="btn" id="add">${pts ? 'سجل النقاط' : 'سجل ختم'}</button><div id="m"></div><div id="res"></div></div>`;
  $('#add').onclick = async () => {
    msg('#m', ''); $('#res').innerHTML = '';
    try {
      const r = await api('POST', '/api/add', { phone: $('#ph').value, name: $('#cn').value, spend: pts ? $('#sp').value : undefined });
      showResult(r.customer, r.added, r.unlocked);
      me = await api('GET', '/api/me');
    } catch (e) { msg('#m', e.message); }
  };
}
function showResult(c, added, unlocked) {
  const goal = c.goal, filled = c.progress;
  const stamps = me.mode === 'stamps' && goal <= 20 ? `<div class="dots">${Array.from({ length: goal }, (_, i) => `<div class="dot ${i < filled ? 'f' : ''}">${i < filled ? '✓' : ''}</div>`).join('')}</div>` : `<div class="bar"><i style="width:${Math.min(100, filled / goal * 100)}%"></i></div>`;
  $('#res').innerHTML = `<div class="ok">تم تسجيل +${added} ${unit(me)} لـ ${esc(c.name || c.phone)}</div>${stamps}
  <div class="center mut">الرصيد ${c.balance} من ${goal}</div>
  ${c.ready > 0 ? `<div class="celebrate">العميل استحق: ${esc(me.reward)}</div><button class="btn" id="red">سلّم المكافأة</button>` : ''}`;
  const rb = $('#red');
  if (rb) rb.onclick = async () => { try { const r = await api('POST', '/api/redeem', { phone: c.phone }); $('#res').innerHTML = `<div class="ok">تم تسليم المكافأة. الرصيد الجديد ${r.customer.balance}</div>`; } catch (e) { msg('#m', e.message); } };
}
async function custView() {
  $('#view').innerHTML = `<div class="card"><input id="q" type="tel" inputmode="numeric" placeholder="ابحث برقم الجوال"><div id="list" style="margin-top:8px"></div></div>`;
  const load = async () => {
    const r = await api('GET', '/api/customers?q=' + encodeURIComponent($('#q').value));
    $('#list').innerHTML = r.customers.length ? r.customers.map(c => `<div class="row"><div><b dir="ltr">${esc(c.phone)}</b> ${esc(c.name)}<small>آخر زيارة ${fmtDate(c.last_visit)} · ${c.visits} زيارة</small></div><div class="center"><b style="color:var(--c);font-size:20px">${c.balance}</b>${c.ready > 0 ? '<small style="color:#b45309">جاهز للمكافأة</small>' : ''}</div></div>`).join('') : '<p class="mut center">لسه مفيش عملاء</p>';
  };
  $('#q').oninput = load; load();
}
function setView() {
  const link = location.origin + '/b/' + me.slug;
  $('#view').innerHTML = `
  <div class="card"><h2>رابط عملائك</h2><p class="mut">العميل يفتح الرابط ويكتب رقمه يشوف رصيده. اطبع الـ QR وحطه عند الكاشير.</p>
  <div class="link" id="lk">${esc(link)}</div>
  <div class="center" style="margin-top:12px"><img alt="QR" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=8&data=${encodeURIComponent(link)}"></div>
  <button class="btn alt" id="cp">انسخ الرابط</button></div>
  <div class="card"><h2>إعدادات الولاء</h2>
  <label>اسم النشاط</label><input id="n" value="${esc(me.name)}">
  <label>النظام</label><select id="md"><option value="stamps" ${me.mode === 'stamps' ? 'selected' : ''}>أختام (زيارات)</option><option value="points" ${me.mode === 'points' ? 'selected' : ''}>نقاط (حسب المبلغ)</option></select>
  <label>الرصيد المطلوب للمكافأة</label><input id="g" type="number" value="${me.goal}">
  <label>نقاط عن كل 1 وحدة عملة (للنقاط فقط)</label><input id="r" type="number" step="0.1" value="${me.rate}">
  <label>المكافأة</label><input id="rw" value="${esc(me.reward)}">
  <label>لون النشاط</label><input id="cl" type="color" value="${me.color}">
  <button class="btn" id="sv">حفظ</button><div id="m"></div>
  <button class="btn alt" id="lo">تسجيل خروج</button></div>`;
  $('#cp').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(link); $('#cp').textContent = 'تم النسخ'; };
  $('#sv').onclick = async () => {
    try { await api('PUT', '/api/settings', { name: $('#n').value, mode: $('#md').value, goal: $('#g').value, rate: $('#r').value, reward: $('#rw').value, color: $('#cl').value }); me = await api('GET', '/api/me'); document.documentElement.style.setProperty('--c', me.color); msg('#m', 'تم الحفظ', true); }
    catch (e) { msg('#m', e.message); }
  };
  $('#lo').onclick = () => { token = ''; localStorage.removeItem('tok'); route(); };
}

// ---------- customer card ----------
async function customerView(slug) {
  let biz;
  try { biz = await api('GET', '/api/public/' + slug); } catch (e) { app.innerHTML = '<div class="card center">النشاط مش موجود</div>'; return; }
  document.documentElement.style.setProperty('--c', biz.color);
  document.title = biz.name;
  app.innerHTML = `<div class="hero"><h1>${esc(biz.name)}</h1><p>كارت الولاء الخاص بيك. المكافأة: <b>${esc(biz.reward)}</b> بعد ${biz.goal} ${unit(biz)}.</p></div>
  <div class="card"><label>اكتب رقم جوالك</label><input id="ph" type="tel" inputmode="numeric" placeholder="05xxxxxxxx" value="${esc(localStorage.getItem('ph_' + slug) || '')}"><button class="btn" id="sh">اعرض كارتي</button><div id="m"></div><div id="res"></div></div>`;
  const go = async () => {
    msg('#m', '');
    try {
      const r = await api('GET', `/api/public/${slug}/card?phone=${encodeURIComponent($('#ph').value)}`);
      localStorage.setItem('ph_' + slug, $('#ph').value);
      if (!r.card) return $('#res').innerHTML = '<p class="center mut">لسه ملكش كارت هنا. اطلب من الكاشير يسجل أول زيارة.</p>';
      const c = r.card, f = c.progress, stampsUi = biz.mode === 'stamps' && c.goal <= 20;
      $('#res').innerHTML = (stampsUi ? `<div class="dots">${Array.from({ length: c.goal }, (_, i) => `<div class="dot ${i < f ? 'f' : ''}">${i < f ? '✓' : ''}</div>`).join('')}</div>` : `<div class="big">${c.balance}</div><div class="bar"><i style="width:${Math.min(100, f / c.goal * 100)}%"></i></div>`)
        + `<p class="center">${c.ready > 0 ? `<b>مبروك! استحقيت: ${esc(biz.reward)}</b>` : `باقي ${c.goal - f} ${unit(biz)} على ${esc(biz.reward)}`}</p><p class="center mut">${c.visits} زيارة · ${c.rewards} مكافأة مستلمة</p>`;
    } catch (e) { msg('#m', e.message); }
  };
  $('#sh').onclick = go; if ($('#ph').value) go();
}
route();
</script>
</body>
</html>
